name: Relay settlement baseline

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/relay-baseline.yml"
      - "scripts/inject-cross-order-test.py"
      - "scripts/audit-production-pool.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundry-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout harness repository
        uses: actions/checkout@v4

      - name: Checkout Relay settlement v0.0.8
        uses: actions/checkout@v4
        with:
          repository: relayprotocol/relay-settlement
          ref: v0.0.8
          path: relay-settlement

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: relay-settlement/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install monorepo dependencies
        working-directory: relay-settlement
        run: yarn install --immutable

      - name: Install Relay-chain Solidity dependencies
        working-directory: relay-settlement/contracts/relay-chain
        run: forge soldeer install

      - name: Show toolchain and source revision
        run: |
          forge --version
          git -C relay-settlement rev-parse HEAD

      - name: Inject cross-order residual-token regression PoC
        run: python3 scripts/inject-cross-order-test.py

      - name: Run Relay-chain Foundry tests
        working-directory: relay-settlement/contracts/relay-chain
        run: forge test -vvv

      - name: Run read-only production FundingPool and residue audit
        run: |
          cp scripts/audit-production-pool.mjs relay-settlement/contracts/relay-chain/script/audit-production-pool.mjs
          node relay-settlement/contracts/relay-chain/script/audit-production-pool.mjs
