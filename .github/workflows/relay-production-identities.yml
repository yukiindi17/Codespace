name: Relay production identity audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/relay-production-identities.yml"
      - "scripts/audit-production-identities.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-read-only:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout harness repository
        uses: actions/checkout@v4

      - name: Checkout Relay settlement v0.0.8
        uses: actions/checkout@v4
        with:
          repository: relayprotocol/relay-settlement
          ref: v0.0.8
          path: relay-settlement

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: relay-settlement/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install monorepo dependencies
        working-directory: relay-settlement
        run: yarn install --immutable

      - name: Read production contract wiring and oracle signer state
        run: |
          cp scripts/audit-production-identities.mjs relay-settlement/contracts/relay-chain/script/audit-production-identities.mjs
          node relay-settlement/contracts/relay-chain/script/audit-production-identities.mjs
