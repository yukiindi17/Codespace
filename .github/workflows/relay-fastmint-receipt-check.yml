name: Relay FAST_MINT receipt and limiter identity investigation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/relay-fastmint-receipt-check.yml"
      - "scripts/audit-fastmint-receipt-check.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: relayprotocol/relay-settlement
          ref: v0.0.8
          path: relay-settlement
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: relay-settlement/yarn.lock
      - run: corepack enable
      - run: yarn install --immutable
        working-directory: relay-settlement
      - name: Inspect production FAST_MINT receipt and limiter state (read-only)
        run: |
          cp scripts/audit-fastmint-receipt-check.mjs relay-settlement/contracts/relay-chain/script/audit-fastmint-receipt-check.mjs
          node relay-settlement/contracts/relay-chain/script/audit-fastmint-receipt-check.mjs
